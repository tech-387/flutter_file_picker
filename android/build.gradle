group 'com.mr.flutter.plugin.filepicker'
version '1.0-SNAPSHOT'

def isAgp9OrAbove = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger() >= 9
def builtInKotlin = isAgp9OrAbove &&
    (findProperty('android.builtInKotlin') ?: 'true').toString().toBoolean()

apply plugin: 'com.android.library'
if (!builtInKotlin) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    compileSdk flutter.compileSdkVersion

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (!builtInKotlin) {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_17.toString()
        }
    }

    dependencies {
        implementation 'androidx.core:core:1.15.0'
        implementation 'androidx.annotation:annotation:1.9.1'
        implementation "androidx.lifecycle:lifecycle-runtime:2.8.7"
    }

    if (project.android.hasProperty("namespace")) {
        namespace 'com.mr.flutter.plugin.filepicker'
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
